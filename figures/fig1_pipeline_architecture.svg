<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="330" style="background:#fff" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial" font-size="12">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#44505c"/></marker>
    <style>.b{fill:#fff;stroke:#44505c;stroke-width:1.3}.g{fill:#fff6e5;stroke:#c98a00;stroke-width:1.3}.t{font-weight:600}.l{stroke:#44505c;stroke-width:1.3;fill:none;marker-end:url(#a)}.s{font-size:10.3px;fill:#5b6470}.r{stroke:#b3261e;stroke-width:1.2;fill:none;stroke-dasharray:4 3;marker-end:url(#a)}</style>
  </defs>
  <rect class="b" x="10" y="40" width="120" height="70" rx="6"/><text x="20" y="60" class="t">1 Ingestion</text><text x="20" y="77" class="s">CSV / DB snapshot</text><text x="20" y="91" class="s">seeded stratified</text><text x="20" y="104" class="s">80/20 split</text>
  <rect class="g" x="155" y="40" width="120" height="70" rx="6"/><text x="165" y="60" class="t">2 Validation</text><text x="165" y="77" class="s">schema · stats ·</text><text x="165" y="91" class="s">semantics</text><text x="165" y="104" class="s">GATE: raise → stop</text>
  <rect class="b" x="300" y="40" width="130" height="70" rx="6"/><text x="310" y="60" class="t">3 Feature eng.</text><text x="310" y="77" class="s">utilisation, pay ratio,</text><text x="310" y="91" class="s">max delay, #delayed,</text><text x="310" y="104" class="s">avg bill, avg pay</text>
  <rect class="b" x="455" y="40" width="130" height="70" rx="6"/><text x="465" y="60" class="t">4 Preprocessing</text><text x="465" y="77" class="s">median impute,</text><text x="465" y="91" class="s">scale, one-hot</text><text x="465" y="104" class="s">(fit on train only)</text>
  <rect class="b" x="610" y="40" width="120" height="70" rx="6"/><text x="620" y="60" class="t">5 Training</text><text x="620" y="77" class="s">sklearn Pipeline</text><text x="620" y="91" class="s">MLflow run: params,</text><text x="620" y="104" class="s">artifacts, model</text>
  <rect class="b" x="755" y="40" width="135" height="70" rx="6"/><text x="765" y="60" class="t">6 Evaluation</text><text x="765" y="77" class="s">AUC, PR AUC, recall,</text><text x="765" y="91" class="s">Brier, per-group</text><text x="765" y="104" class="s">fairness gap</text>
  <path class="l" d="M130,75 L153,75"/><path class="l" d="M275,75 L298,75"/><path class="l" d="M430,75 L453,75"/><path class="l" d="M585,75 L608,75"/><path class="l" d="M730,75 L753,75"/>
  <rect class="g" x="700" y="160" width="190" height="62" rx="6"/><text x="710" y="180" class="t">7 Quality gate</text><text x="710" y="197" class="s">AUC≥0.70 · PR AUC≥0.45 ·</text><text x="710" y="211" class="s">gap≤0.10 (missing = fail)</text>
  <path class="l" d="M822,110 L822,158"/>
  <rect class="b" x="440" y="160" width="220" height="62" rx="6"/><text x="450" y="180" class="t">8 Registry (MLflow)</text><text x="450" y="197" class="s">CLI default: register all;</text><text x="450" y="211" class="s">DAG: register passed only</text>
  <path class="l" d="M700,191 L662,191"/>
  <rect class="b" x="170" y="160" width="230" height="62" rx="6"/><text x="180" y="180" class="t">9 Deployment (planned)</text><text x="180" y="197" class="s">API would load @champion;</text><text x="180" y="211" class="s">staged release needs a target</text>
  <path class="l" d="M440,191 L402,191"/>
  <rect class="b" x="10" y="160" width="130" height="62" rx="6"/><text x="20" y="180" class="t">10 Monitoring</text><text x="20" y="197" class="s">PSI drift, score dist.,</text><text x="20" y="211" class="s">fairness, golden signals</text>
  <path class="l" d="M170,191 L142,191"/>
  <path class="r" d="M75,222 C75,300 520,300 520,112"/><text x="200" y="292" class="s" fill="#b3261e">planned: drift alert → re-run pipeline (Airflow)</text>
  <path class="r" d="M215,112 C215,140 60,130 60,158"/><text x="40" y="140" class="s" fill="#b3261e">fail → alert, no training</text>
  <text x="10" y="25" class="s">Data flow: raw frame → validation → 29 engineered columns → fitted Pipeline → metrics → quality gate → registry decision</text>
</svg>